<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Manus Liquid Glass UI</title>
    <link rel="stylesheet" href="../static/css/style.css" />
</head>

<body class="page-wrapper">
  
  <!-- Script to prevent flash of unstyled theme -->
  <script>
    (function() {
      var theme = localStorage.getItem('preferred-theme') || 'system';
      var isDark = theme === 'dark' || (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
      if(isDark) document.body.classList.add('dark-theme');
      else document.body.classList.add('light-theme');
    })();
  </script>

  <!-- Upper Right Theme Dropdown -->
  <div class="top-bar">
    <div class="theme-dropdown-container">
      <button id="themeToggleBtn" class="circle-btn theme-toggle-btn" title="Theme Settings">
        <svg class="theme-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="9"></circle>
          <path d="M12 3v18a9 9 0 0 0 0-18z"></path>
        </svg>
      </button>
      <div id="themeDropdownMenu" class="theme-dropdown-menu menu-hidden">
        <button class="theme-option" data-theme="system">System</button>
        <button class="theme-option" data-theme="light">Light</button>
        <button class="theme-option" data-theme="dark">Dark</button>
      </div>
    </div>
  </div>

  <div id="main-card" class="main-card">
    
    <!-- Welcome Heading (Initial Stage Only) -->
    <h1 class="welcome-heading">What can I do for you?</h1>

    <!-- Result area (hidden by default) -->
    <div id="answer-container" class="answer-container hidden">
      <!-- User Message -->
      <div class="message-group user-group">
        <div class="question-bubble full" id="question-display"></div>
      </div>

      <!-- AI Message -->
      <div class="message-group ai-group">
        <div class="answer-bubble" aria-label="Answer">
          <div id="answer" class="answer-text"></div>
        </div>
        
        <div class="citations-bubble" aria-label="Citations">
          <div class="bubble-title">Citations</div>
          <div id="citations" class="citations"></div>
        </div>
      </div>
    </div>

    <!-- The Liquid Glass Input Area -->
    <div class="glass-input-wrapper">
      <div class="glass-input-container">
        <!-- Text Input -->
        <input id="question" type="text" placeholder="Upload a file" class="glass-input" />
        
        <!-- Action Buttons -->
        <div class="glass-actions">
          <div class="actions-left">
             <!-- Plus button for file upload -->
             <input id="file" type="file" accept=".pdf,.txt" hidden />
             <label for="file" class="circle-btn" title="Upload document">
               <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
             </label>
             
             <!-- Minimal Model Select -->
             <select id="model" class="model-select">
               <option value="gpt-oss:20b" selected>gpt-oss:20b</option>
               <option value="qwen2.5-coder:14b">qwen2.5-coder:14b</option>
             </select>

             <!-- Hidden Top-k for backend -->
             <input type="hidden" id="topk" value="5" />
          </div>

          <div class="actions-right">
             <!-- Send Button (Up Arrow) -->
             <button id="askBtn" class="circle-btn send-btn" title="Send">
               <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"></line><polyline points="5 12 12 5 19 12"></polyline></svg>
             </button>
          </div>
        </div>
      </div>
      
      <!-- Status/Error Message -->
      <div id="status" class="status-msg">No file ingested yet.</div>
    </div>
  </div>

  <script src="../static/js/main.js"></script>
  
  <!-- Inline logic for dynamic UI updates (leaving main.js strictly untouched) -->
  <script>
    // 1. Dynamic placeholder based on file upload
    const fileInputMod = document.getElementById('file');
    const questionInputMod = document.getElementById('question');
    if (fileInputMod && questionInputMod) {
      fileInputMod.addEventListener('change', (e) => {
        const hasFile = e.target.files && e.target.files.length > 0;
        questionInputMod.placeholder = hasFile ? "Ask anything from the document" : "Upload a file";
      });
    }

    // 2. Red Error message handling strictly for "upload a document" omission error
    const statusElObs = document.getElementById('status');
    const observer = new MutationObserver(() => {
      const text = statusElObs.textContent || '';
      // Only show red if user tried to send without a file
      if (text.includes('upload a document first') || text.includes('upload a file')) {
        statusElObs.style.color = '#ff453a'; // Apple error red
        statusElObs.style.fontWeight = '500';
      } else {
        statusElObs.style.color = 'var(--text-secondary)';
        statusElObs.style.fontWeight = 'normal';
      }
    });
    observer.observe(statusElObs, { childList: true, characterData: true, subtree: true });

    // 3. Theme Toggle Dropdown Logic
    const themeToggleBtn = document.getElementById('themeToggleBtn');
    const themeDropdownMenu = document.getElementById('themeDropdownMenu');
    const themeOptions = document.querySelectorAll('.theme-option');

    themeToggleBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        themeDropdownMenu.classList.toggle('menu-hidden');
    });

    document.addEventListener('click', () => {
        themeDropdownMenu.classList.add('menu-hidden');
    });

    function applyTheme(theme) {
        document.body.classList.remove('light-theme', 'dark-theme');
        if (theme === 'system') {
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            document.body.classList.add(prefersDark ? 'dark-theme' : 'light-theme');
        } else {
            document.body.classList.add(`${theme}-theme`);
        }
        localStorage.setItem('preferred-theme', theme);
    }

    // Active state for buttons
    function updateDropdownActiveState(selectedTheme) {
        themeOptions.forEach(btn => {
            if(btn.getAttribute('data-theme') === selectedTheme) {
                btn.style.fontWeight = '600';
                btn.style.color = 'var(--text-primary)';
            } else {
                btn.style.fontWeight = 'normal';
                btn.style.color = 'var(--text-secondary)';
            }
        });
    }

    const savedTheme = localStorage.getItem('preferred-theme') || 'system';
    updateDropdownActiveState(savedTheme);

    themeOptions.forEach(btn => {
        btn.addEventListener('click', (e) => {
            const theme = e.target.getAttribute('data-theme');
            applyTheme(theme);
            updateDropdownActiveState(theme);
        });
    });

    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', (e) => {
        if (localStorage.getItem('preferred-theme') === 'system') {
            document.body.classList.remove('light-theme', 'dark-theme');
            document.body.classList.add(e.matches ? 'dark-theme' : 'light-theme');
        }
    });
  </script>
</body>
</html>
